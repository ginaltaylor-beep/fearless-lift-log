<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>Fearless Lift Log v0.7</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#172033;--muted:#667085;--line:#d0d5dd;
  --accent:#172033;--accent2:#344054;--soft:#eef2ff;--good:#166534;--goodbg:#dcfce7;
  --warn:#92400e;--warnbg:#fef3c7;--danger:#991b1b;--shadow:0 2px 8px rgba(16,24,40,.06)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.96);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.header-row{max-width:820px;margin:auto;display:flex;align-items:center;gap:10px}
h1{font-size:21px;margin:0;flex:1}.sub{font-size:13px;color:var(--muted);margin-top:3px}
main{max-width:820px;margin:auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}
.pad{padding:16px}.hero{padding:18px}.hero h2{margin:0 0 6px;font-size:23px}.hero p{margin:0;color:var(--muted);line-height:1.45}
.day-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.day-grid button:last-child{grid-column:1/-1}
button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:750;background:#e4e7ec;color:var(--ink);min-height:46px}
button.primary{background:var(--accent);color:#fff}button.secondary{background:#fff;border:1px solid var(--line)}button.good{background:var(--good);color:#fff}
button:disabled{opacity:.45}.small-btn{min-height:38px;padding:8px 10px;font-size:14px}
.nav-btn{background:transparent;padding:6px 8px;min-height:36px;font-size:22px}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.start-grid button{padding:15px 6px}
.order{font-weight:800;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 12px}
.station-head{padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}.station-title{font-weight:850;font-size:18px;flex:1}.station-meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:12px;font-weight:750;border-radius:999px;padding:5px 9px;background:#e5e7eb}.badge.done{background:var(--goodbg);color:var(--good)}
.station-body{padding:0 12px 14px}.exercise{border-top:1px solid #e5e7eb;padding:14px 0 5px}.exercise h3{font-size:16px;margin:0 0 2px}.hint{font-size:12px;color:var(--muted);margin-bottom:8px}
.previous{font-size:12px;background:var(--soft);border-radius:10px;padding:8px 10px;margin:7px 0 10px;line-height:1.4}
.set-card{background:#fafafa;border:1px solid #e4e7ec;border-radius:12px;padding:10px;margin:8px 0}.set-title{font-weight:850;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field-grid.three{grid-template-columns:1fr 1fr 1fr}.field{min-width:0}label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;border:1px solid #c7cbd1;border-radius:10px;padding:9px;background:#fff;font:inherit;font-size:16px;min-height:44px}input[type=number]{text-align:center}textarea{min-height:80px;text-align:left}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:5px}.stepper button{padding:0;min-height:44px;font-size:22px;background:#e4e7ec}.stepper input{min-width:0}
.increment-row{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:12px;color:var(--muted)}.increment-row select{width:auto;min-height:36px;padding:6px 26px 6px 8px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.actions button{flex:1}.delete{background:#fee2e2;color:var(--danger);min-height:36px;padding:6px 10px}
.complete{width:100%;margin-top:14px;background:var(--goodbg);color:var(--good);min-height:49px}.complete.done{background:var(--good);color:#fff}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.footer button{max-width:390px;flex:1}
.summary{text-align:center;padding:22px 18px}.congrats-volume{background:var(--goodbg);color:var(--good);border-radius:14px;padding:15px 12px;margin:16px 0 4px;font-size:19px;font-weight:850;line-height:1.35}.highlights{text-align:left;background:#fffaf0;border:1px solid #f3dfad;border-radius:14px;padding:13px 14px;margin:16px 0}.highlight{font-weight:760;line-height:1.4;padding:5px 0}.remember{background:var(--accent);color:#fff;border-radius:14px;padding:14px;margin:16px 0;text-align:left}.remember .sub{color:#d0d5dd}.journey-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.journey-box{background:#f8fafc;border-radius:12px;padding:12px}.journey-box strong{display:block;font-size:19px}.journey-box span{font-size:11px;color:var(--muted)}.summary h2{font-size:25px;margin:0 0 6px}.big-number{font-size:42px;font-weight:900;letter-spacing:-1px;margin:14px 0 2px}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#f8fafc;border-radius:12px;padding:11px 6px}.stat strong{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.history-item{padding:13px 0;border-bottom:1px solid #e5e7eb}.history-item:last-child{border-bottom:0}.history-top{display:flex;gap:10px;align-items:flex-start}.history-title{font-weight:800;flex:1}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:12px}.hidden{display:none!important}
@media(max-width:520px){.field-grid.three{grid-template-columns:1fr 1fr}.summary-stats{grid-template-columns:1fr 1fr 1fr}.day-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

function normalizeExerciseName(value){return String(value||'').trim().toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
function slugExerciseName(value){return normalizeExerciseName(value).replace(/\s+/g,'_')||`exercise_${uid()}`}
function allExerciseDefinitions(){return {...exercises,...(db?.exerciseLibrary||{})}}
function rebuildExerciseLookup(){
 const defs=allExerciseDefinitions();
 return Object.fromEntries(Object.entries(defs).flatMap(([id,ex])=>[[normalizeExerciseName(ex.name),id],[normalizeExerciseName(id),id]]));
}
function canonicalExerciseId(value){
 const raw=String(value||'').trim();
 const lower=raw.toLowerCase();
 const lookup=rebuildExerciseLookup();
 return EXERCISE_ALIASES[raw]||HISTORICAL_NAME_ALIASES[lower]||lookup[normalizeExerciseName(raw)]||slugExerciseName(raw);
}
function genericExerciseDefinition(id,name=id){

}
function ensureExerciseDefinition(id,definition){
 if(exercises[id])return exercises[id];
 db.exerciseLibrary=db.exerciseLibrary||{};
 if(!db.exerciseLibrary[id])db.exerciseLibrary[id]={...genericExerciseDefinition(id,definition?.name||id),...(definition||{})};
 return db.exerciseLibrary[id];
}
function exerciseDefinition(id){return exercises[id]||db.exerciseLibrary?.[id]||ensureExerciseDefinition(id)}
function remapExerciseData(data,sourceLibrary={}){
 const out={};
 for(const [rawId,value] of Object.entries(data||{})){
  const sourceDef=sourceLibrary[rawId]||sourceLibrary[canonicalExerciseId(rawId)]||null;
  const id=canonicalExerciseId(sourceDef?.name||rawId);
  ensureExerciseDefinition(id,sourceDef||{name:rawId});
  out[id]=value;
 }
 return out;
}

function newWorkout(day,date=today()){
 const w={id:uid(),version:'0.7',program:'July 2026',day,title:programs[day].title,date,startStation:null,stationOrder:[],completed:{},data:{},notes:'',startedAt:new Date().toISOString(),finishedAt:null};

}
function defaultData(ex){
 if(ex.kind==='cardio') return {speed:'',distance:'',difficulty:'',notes:''};
 if(ex.kind==='time') return [{seconds:'',difficulty:''}];
 if(ex.kind==='reps') return [{reps:'',difficulty:''}];
 if(ex.kind==='drop') return [{weight1:'',weight2:'',reps:'',difficulty:''}];
 return [{weight:'',reps:'',difficulty:''}];
}
function currentIncrement(id){return Number(db.increments[id]??exercises[id].increment??2.5)}
function setIncrement(id,v){db.increments[id]=Number(v);saveDb();render()}
function lastWorkout(day){return [...db.history].filter(h=>h.day===day).sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date))[0]}
function lastExerciseSummary(id,day){
 const h=lastWorkout(day); if(!h||!h.data?.[id]) return 'No prior workout recorded yet.';
 const ex=exerciseDefinition(id),d=h.data[id];
 if(ex.kind==='cardio') return `Last ${day}: speed ${d.speed||'—'}${d.distance?` · distance ${d.distance}`:''}`;
 if(!Array.isArray(d)) return 'Prior data available.';
 const parts=d.map(s=>{
  if(ex.kind==='band') return `${s.weight||s.band||'—'} · ${s.reps||'—'} reps${s.difficulty?` · ${s.difficulty}`:''}`;
  if(ex.kind==='time') return `${s.seconds||'—'} sec${s.difficulty?` · ${s.difficulty}`:''}`;
  if(ex.kind==='reps') return `${s.reps||'—'} reps${s.difficulty?` · ${s.difficulty}`:''}`;
  if(ex.kind==='drop') return `${s.weight1||'—'}→${s.weight2||'—'} × ${s.reps||'—'}`;
  return `${s.weight||'—'} lb × ${s.reps||'—'}${s.difficulty?` · ${s.difficulty}`:''}`;
 }).join(' | ');
 return `Last ${day}: ${parts}`;
}

function allStationsDone(w){return [1,2,3,4].every(n=>w.completed[n])}
function totalVolume(w){
 let total=0;
 for(const [id,d] of Object.entries(w.data)){const ex=exerciseDefinition(id);if(!ex||!ex.multiplier||!Array.isArray(d))continue;for(const s of d){if(ex.kind==='drop'){const reps=Number(s.reps)||0;total+=((Number(s.weight1)||0)+(Number(s.weight2)||0))*reps*ex.multiplier}else total+=(Number(s.weight)||0)*(Number(s.reps)||0)*ex.multiplier}}
 return Math.round(total);
}
function countSets(w){let n=0;for(const [id,d] of Object.entries(w.data)){const ex=exerciseDefinition(id);if(Array.isArray(d))n+=d.filter(s=>Object.values(s).some(v=>String(v).trim()!=='')).length;else if(exerciseDefinition(id)?.kind==='cardio'&&Object.values(d).some(v=>String(v).trim()!==''))n++}return n}
function countExercises(w){let n=0;for(const d of Object.values(w.data)){if(Array.isArray(d)){if(d.some(s=>Object.values(s).some(v=>String(v).trim()!=='')))n++}else if(Object.values(d).some(v=>String(v).trim()!==''))n++}return n}
function durationMinutes(w){if(!w.startedAt||!w.finishedAt)return null;return Math.max(1,Math.round((new Date(w.finishedAt)-new Date(w.startedAt))/60000))}
function exerciseMax(id,w){const ex=exerciseDefinition(id),d=w?.data?.[id];if(!ex||!Array.isArray(d))return 0;if(ex.kind==='drop')return Math.max(0,...d.flatMap(s=>[Number(s.weight1)||0,Number(s.weight2)||0]));if(!['weight'].includes(ex.kind))return 0;return Math.max(0,...d.map(s=>Number(s.weight)||0))}
function repsAtMax(id,w,max){const d=w?.data?.[id];if(!Array.isArray(d)||!max)return 0;return d.reduce((n,s)=>n+((Number(s.weight)||0)===max?(Number(s.reps)||0):0),0)}
function comparablePrevious(w){return [...db.history].filter(h=>h.day===w.day&&h.id!==w.id&&(h.finishedAt||h.date)<(w.finishedAt||w.date)).sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date))[0]}
function workoutHighlights(w){
 const previous=comparablePrevious(w),highlights=[],improvements=[];
 for(const id of Object.keys(w.data)){
  const ex=exerciseDefinition(id),now=exerciseMax(id,w);if(!ex||!now)continue;
  const priorBest=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>exerciseMax(id,h)));
  const previousMax=exerciseMax(id,previous);
  if(priorBest&&now>priorBest){improvements.push({rank:100+now,text:`⭐ New ${ex.name} personal best — ${now} lb`});continue}
  if(priorBest&&now===priorBest){improvements.push({rank:70,text:`⭐ Matched your best ${ex.name} — ${now} lb`});continue}
  if(previousMax&&now>previousMax){improvements.push({rank:80,text:`⭐ Increased ${ex.name} from ${previousMax} to ${now} lb`});continue}
  if(previousMax&&now===previousMax&&repsAtMax(id,w,now)>repsAtMax(id,previous,previousMax)) improvements.push({rank:60,text:`⭐ More reps at your top ${ex.name} weight`});
 }
 improvements.sort((a,b)=>b.rank-a.rank);highlights.push(...improvements.slice(0,3).map(x=>x.text));
 const priorVolume=previous?totalVolume(previous):0,volume=totalVolume(w);
 if(previous&&volume>priorVolume&&highlights.length<3)highlights.push(`📈 Higher ${w.title} volume than last time`);
 if(allStationsDone(w)&&highlights.length<4)highlights.push('⭐ Completed every station');
 const expected=Object.values(programs[w.day].stations).flat().length;
 if(countExercises(w)===expected&&highlights.length<4)highlights.push('✅ Logged every exercise');
 const workoutNumber=db.history.filter(h=>h.id!==w.id).length+1;
 if([10,25,50,100,250,500].includes(workoutNumber))highlights.unshift(`💪 Workout #${workoutNumber}`);
 const deadlift=Math.max(exerciseMax('barbell_romanian_deadlift',w),exerciseMax('single_leg_romanian_deadlift',w));
 const priorDeadlift=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>Math.max(exerciseMax('barbell_romanian_deadlift',h),exerciseMax('single_leg_romanian_deadlift',h))));
 if(deadlift>=200&&priorDeadlift<200)highlights.unshift('🔥 First 200 lb deadlift!');
 const bench=exerciseMax('barbell_bench_press',w),priorBench=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>exerciseMax('barbell_bench_press',h)));
 if(bench>=100&&priorBench<100)highlights.unshift('🔥 First 100 lb bench press!');
 if(!highlights.length)highlights.push('⭐ Another workout added to your strength journey');
 return highlights.slice(0,5);
}

function normalizedImportedWorkout(raw,sourceLibrary={}){

 if(!w||typeof w!=='object'||!w.date||!w.day||!w.data)return null;
 const copy=JSON.parse(JSON.stringify(w));
 copy.id=copy.id||uid();
 copy.version='0.5';
 copy.program=copy.program||'Historical Import';
 copy.title=copy.title||programs[copy.day]?.title||'Workout';
 copy.completed=copy.completed||{1:true,2:true,3:true,4:true};
 copy.stationOrder=copy.stationOrder||[1,2,3,4];
 copy.finishedAt=copy.finishedAt||`${copy.date}T12:00:00`;
 copy.startedAt=copy.startedAt||copy.finishedAt;
 copy.notes=copy.notes||'';
 copy.data=remapExerciseData(copy.data,sourceLibrary);
 if(!Object.keys(copy.data).length)return null;
 return copy;
}
function collectImportedWorkouts(payload){
 if(Array.isArray(payload))return payload;
 if(payload?.workout)return [payload.workout];
 if(Array.isArray(payload?.history))return payload.history;
 if(Array.isArray(payload?.workouts))return payload.workouts;
 return [];
}
function openImport(){document.getElementById('importInput').click()}
async function importWorkoutFiles(fileList){
 const files=[...fileList];
 if(!files.length)return;
 let imported=0,duplicates=0,invalid=0;
 const existingIds=new Set(db.history.map(w=>w.id));
 const existingKeys=new Set(db.history.map(workoutIdentity));
 for(const file of files){
  try{
   const payload=JSON.parse(await file.text());
   const sourceLibrary=payload?.exerciseLibrary||payload?.db?.exerciseLibrary||{};
   for(const [rawId,def] of Object.entries(sourceLibrary)){const id=canonicalExerciseId(def?.name||rawId);ensureExerciseDefinition(id,def)}
   const rows=collectImportedWorkouts(payload?.db||payload);
   if(!rows.length){invalid++;continue}
   for(const raw of rows){
    const w=normalizedImportedWorkout(raw,sourceLibrary);
    if(!w){invalid++;continue}
    const key=workoutIdentity(w);
    if(existingIds.has(w.id)||existingKeys.has(key)){duplicates++;continue}
    db.history.push(w);existingIds.add(w.id);existingKeys.add(key);imported++;
   }
  }catch{invalid++}
 }
 db.history.sort((a,b)=>(a.finishedAt||a.date).localeCompare(b.finishedAt||b.date));
 saveDb();
 document.getElementById('importInput').value='';
 alert(`Import complete: ${imported} workout${imported===1?'':'s'} added, ${duplicates} duplicate${duplicates===1?'':'s'} skipped${invalid?`, ${invalid} file or record${invalid===1?'':'s'} could not be read`:''}.`);
 render();
}
function difficulty(value,id,index){return `<select onchange="updateValue('${id}',${index},'difficulty',this.value)">${DIFFICULTIES.map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('')}</select>`}
function stepper(id,index,field,value,placeholder){return `<div class="stepper"><button type="button" onclick="step('${id}',${index},'${field}',-1)">−</button><input type="number" inputmode="decimal" value="${esc(value)}" placeholder="${placeholder}" onchange="updateValue('${id}',${index},'${field}',this.value)"><button type="button" onclick="step('${id}',${index},'${field}',1)">+</button></div>`}

function exerciseHtml(id){
 const ex=exerciseDefinition(id),d=view.workout.data[id];
 let body='';
 if(ex.kind==='cardio') body=`<div class="field-grid three"><div class="field"><label>Speed</label><input inputmode="decimal" value="${esc(d.speed)}" onchange="updateValue('${id}',0,'speed',this.value)"></div><div class="field"><label>Distance</label><input inputmode="decimal" value="${esc(d.distance)}" onchange="updateValue('${id}',0,'distance',this.value)"></div><div class="field"><label>Difficulty</label><select onchange="updateValue('${id}',0,'difficulty',this.value)">${DIFFICULTIES.map(([v,l])=>`<option value="${v}" ${d.difficulty===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field" style="margin-top:8px"><label>Notes</label><input value="${esc(d.notes)}" placeholder="Incline, intervals, most/all…" onchange="updateValue('${id}',0,'notes',this.value)"></div>`;
 else body=d.map((s,i)=>setHtml(id,ex,s,i)).join('')+`<div class="actions"><button onclick="addSet('${id}',true)">Repeat Previous Set</button><button onclick="addSet('${id}',false)">Add Empty Set</button></div>`;
 const inc=ex.increment!=null?`<div class="increment-row">Weight +/− changes by <select onchange="setIncrement('${id}',this.value)">${INCREMENTS.map(v=>`<option value="${v}" ${currentIncrement(id)===v?'selected':''}>${v} lb</option>`).join('')}</select></div>`:'';
 return `<div class="exercise"><h3>${ex.name}</h3><div class="hint">${ex.label}${ex.note?` · ${ex.note}`:''}</div><div class="previous">${lastExerciseSummary(id,view.day)}</div>${body}${inc}</div>`;
}
function setHtml(id,ex,s,i){
 let fields='';
 if(ex.kind==='band') fields=`<div class="field"><label>Band color</label><select onchange="updateValue('${id}',${i},'weight',this.value)"><option value="">Choose</option>${BANDS.map(b=>`<option ${String(s.weight||'').toLowerCase()===b.toLowerCase()?'selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label>Reps performed</label>${stepper(id,i,'reps',s.reps,'0')}</div><div class="field"><label>Difficulty</label>${difficulty(s.difficulty,id,i)}</div>`;
 else if(ex.kind==='time') fields=`<div class="field"><label>Seconds</label>${stepper(id,i,'seconds',s.seconds,'0')}</div><div class="field"><label>Difficulty</label>${difficulty(s.difficulty,id,i)}</div>`;
 else if(ex.kind==='reps') fields=`<div class="field"><label>Reps performed</label>${stepper(id,i,'reps',s.reps,'0')}</div><div class="field"><label>Difficulty</label>${difficulty(s.difficulty,id,i)}</div>`;
 else if(ex.kind==='drop') fields=`<div class="field"><label>Weight 1</label>${stepper(id,i,'weight1',s.weight1,'lb')}</div><div class="field"><label>Weight 2</label>${stepper(id,i,'weight2',s.weight2,'lb')}</div><div class="field"><label>Reps performed</label>${stepper(id,i,'reps',s.reps,'0')}</div><div class="field"><label>Difficulty</label>${difficulty(s.difficulty,id,i)}</div>`;
 else fields=`<div class="field"><label>${ex.label}</label>${stepper(id,i,'weight',s.weight,'lb')}</div><div class="field"><label>Reps performed</label>${stepper(id,i,'reps',s.reps,'0')}</div><div class="field"><label>Difficulty</label>${difficulty(s.difficulty,id,i)}</div>`;
 return `<div class="set-card"><div class="set-title"><span>Set ${i+1}</span><button class="delete small-btn" onclick="deleteSet('${id}',${i})">Remove</button></div><div class="field-grid ${ex.kind==='drop'?'three':''}">${fields}</div></div>`;
}

function openExerciseIndex(){saveDraft();view={screen:'exerciseIndex',day:null,workout:null,summary:null};render()}
function exerciseIndexRows(){
 const defs=allExerciseDefinitions(),stats={};
 for(const w of db.history||[]){
  for(const [id,d] of Object.entries(w.data||{})){
   const ex=defs[id]||exerciseDefinition(id);const st=stats[id]||(stats[id]={id,name:ex.name,category:ex.category||'Other',first:w.date,last:w.date,workouts:0,best:0,repsAtBest:0,volume:0});
   st.first=st.first<w.date?st.first:w.date;st.last=st.last>w.date?st.last:w.date;st.workouts++;
   if(Array.isArray(d))for(const set of d){
    const wt=Number(set.weight??set.weight1)||0,reps=Number(set.reps)||0;
    if(wt>st.best){st.best=wt;st.repsAtBest=reps}else if(wt===st.best)st.repsAtBest=Math.max(st.repsAtBest,reps);
    if(ex.multiplier)st.volume+=wt*reps*ex.multiplier;
   }
  }
 }
 return Object.values(stats).sort((a,b)=>a.name.localeCompare(b.name));
}
function renderExerciseIndex(){
 const rows=exerciseIndexRows();
 return `<section class="card pad"><strong>Exercise Index</strong><div class="sub">Built automatically from your workout history.</div>${rows.length?rows.map(r=>`<div class="history-item"><div class="history-title">${esc(r.name)}</div><div class="history-meta">${esc(r.category)} · ${r.workouts} workout${r.workouts===1?'':'s'} · ${r.first} to ${r.last}</div>${r.best?`<div class="sub" style="margin-top:5px">Best recorded weight: ${r.best} lb${r.repsAtBest?` × ${r.repsAtBest}`:''}</div>`:''}</div>`).join(''):'<p class="sub">The index will populate as workouts are imported or completed.</p>'}</section>`;
}

function renderHome(){
 const weekday=dayForDate(),days=Object.keys(programs),rows=[...db.history].sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date)),last=rows[0];
 const backupCurrent=!!last&&db.lastBackupWorkoutId===last.id;
 return `<section class="card hero"><h2>Ready to lift? 🏋️</h2><p>Choose today's workout. Your entries save automatically on this device.</p><div class="day-grid">${days.map(d=>`<button class="${d===weekday?'primary':''}" onclick="openDay('${d}')">${d}<span class="sub" style="display:block;color:${d===weekday?'#d0d5dd':'var(--muted)'}">${programs[d].title}</span></button>`).join('')}</div></section>
 <section class="card pad"><strong>Your Strength Journey</strong><div class="journey-grid"><div class="journey-box"><strong>${db.history.length}</strong><span>workouts logged</span></div><div class="journey-box"><strong>${last?last.day:'—'}</strong><span>last workout</span></div></div>${last?`<div class="previous"><strong>Last highlight</strong><br>${esc(last.primaryHighlight||last.highlights?.[0]||'⭐ Workout complete')}</div>`:'<p class="sub">Your first completed workout will begin your story.</p>'}<div class="previous"><strong>Backup status</strong><br>${backupCurrent?'✓ Current':'Backup recommended after your next completed workout'}</div><div class="actions"><button onclick="openHistory()">View History</button><button onclick="openExerciseIndex()">Exercise Index</button><button onclick="openImport()">Import Workouts</button><button onclick="downloadAll()">Back Up All Data</button></div></section>
 <section class="card pad"><strong>Built for the gym</strong><div class="sub" style="line-height:1.65;margin-top:8px">Fearless Lift Log displays workout information only—nothing beyond your lifting history and progress.<br><span style="font-size:11px">Data model v0.7 · Historical Exercise Index</span></div></section>`;
}
function renderWorkout(){
 const w=view.workout,p=programs[view.day];
 const startCard=!w.startStation?`<section class="card pad"><strong>Which station are you starting at?</strong><div class="sub">The circular order is recorded automatically.</div><div class="start-grid">${[1,2,3,4].map(n=>`<button onclick="startWorkout(${n})">${n}</button>`).join('')}</div></section>`:'';
 const order=w.startStation?`<div class="order">Started at Station ${w.startStation} · ${w.stationOrder.join(' → ')}</div>`:'';
 const stationOrder=w.startStation?w.stationOrder:[1,2,3,4];
 const stations=stationOrder.map((n,pos)=>{const done=!!w.completed[n],ids=p.stations[n];return `<section class="card"><div class="station-head" onclick="this.nextElementSibling.classList.toggle('hidden')"><div><div class="station-title">Station ${n}</div><div class="station-meta">${w.startStation?['1st','2nd','3rd','4th'][pos]+' in workout':'Choose a starting station'}</div></div><span class="badge ${done?'done':''}">${done?'Complete':'Open'}</span></div><div class="station-body ${done?'hidden':''}">${ids.map(exerciseHtml).join('')}<button class="complete ${done?'done':''}" onclick="event.stopPropagation();toggleStation(${n})">${done?'✓ Station Complete':'Mark Station Complete'}</button></div></section>`}).join('');
 return `${startCard}${order}${stations}<section class="card pad"><strong>Workout notes</strong><textarea id="workoutNotes" placeholder="Anything worth remembering…" onchange="view.workout.notes=this.value;saveDraft()">${esc(w.notes)}</textarea></section>`;
}
function renderSummary(){const w=view.workout,s=view.summary,highlights=s.highlights||w.highlights||['⭐ Workout complete'],backupCurrent=db.lastBackupWorkoutId===w.id;return `<section class="card summary"><h2>🏋️ Workout Complete!</h2><div class="sub">${w.day} · ${w.title}</div><div class="congrats-volume">Congratulations — you lifted ${s.volume.toLocaleString()} pounds today!</div><div class="highlights">${highlights.map(h=>`<div class="highlight">${esc(h)}</div>`).join('')}</div><div class="remember"><div class="sub">Today you'll remember:</div><strong>${esc(w.primaryHighlight||highlights[0])}</strong></div><div class="summary-stats"><div class="stat"><strong>${s.exercises}</strong><span>exercises</span></div><div class="stat"><strong>${s.sets}</strong><span>sets logged</span></div><div class="stat"><strong>${s.duration||'—'}</strong><span>${s.duration?'minutes':'duration'}</span></div></div><div class="sub" style="margin-top:8px">Training volume = weight × reps, including both dumbbells when applicable.</div><div class="notice">✓ Saved on this device<br>${backupCurrent?'✓ Backup created':'Backup ready to save'}</div><div class="actions" style="margin-top:16px"><button onclick="downloadBackup(view.workout)">Save Backup Again</button><button class="primary" onclick="goHome()">Return Home</button></div><p class="sub" style="margin-top:18px">See you next workout. 💪</p></section>`}
function renderHistory(){
 const rows=[...db.history].sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date));
 return `<section class="card pad"><strong>Workout History</strong><div class="sub">Your strength story, workout by workout.</div>${rows.length?rows.map(w=>`<div class="history-item"><div class="history-top"><div><div class="history-title">${w.day} · ${w.title}</div><div class="history-meta">${w.date} · ${totalVolume(w).toLocaleString()} lb volume</div></div><button class="small-btn" onclick="downloadBackup(db.history.find(x=>x.id==='${w.id}'))">Backup</button></div>${(w.highlights||[]).slice(0,3).map(h=>`<div class="sub" style="margin-top:6px">${esc(h)}</div>`).join('')}${w.notes?`<div class="sub" style="margin-top:6px">${esc(w.notes)}</div>`:''}</div>`).join(''):'<p class="sub">No completed workouts yet.</p>'}</section>`;
}
function render(){
 migrateDatabaseToV07();migrateOldFriday();const app=document.getElementById('app'),footer=document.getElementById('footer'),back=document.getElementById('backBtn'),sub=document.getElementById('headerSub');
 back.classList.toggle('hidden',view.screen==='home');back.onclick=goHome;
 if(view.screen==='home'){sub.textContent='Know your history. Challenge yourself appropriately.';app.innerHTML=renderHome();footer.classList.add('hidden')}
 if(view.screen==='workout'){sub.textContent=`${view.day} · ${programs[view.day].title} · July 2026`;app.innerHTML=renderWorkout();footer.classList.remove('hidden');footer.innerHTML=`<button onclick="resetWorkout()">Reset</button><button class="primary" ${allStationsDone(view.workout)?'':'disabled'} onclick="finishWorkout()">Finish Workout</button>`}
 if(view.screen==='summary'){sub.textContent='Workout complete';app.innerHTML=renderSummary();footer.classList.add('hidden')}
 if(view.screen==='history'){sub.textContent='Your strength journey';app.innerHTML=renderHistory();footer.classList.add('hidden')}
 if(view.screen==='exerciseIndex'){sub.textContent='Your exercise history';app.innerHTML=renderExerciseIndex();footer.classList.add('hidden')}
}
document.getElementById('importInput').addEventListener('change',e=>importWorkoutFiles(e.target.files));
window.addEventListener('beforeunload',saveDraft);render();
</script>
