<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>Fearless Lift Log v16.8</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#172033;--muted:#667085;--line:#d0d5dd;
  --accent:#172033;--accent2:#344054;--soft:#eef2ff;--good:#166534;--goodbg:#dcfce7;
  --warn:#92400e;--warnbg:#fef3c7;--danger:#991b1b;--shadow:0 2px 8px rgba(16,24,40,.06)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.96);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.header-row{max-width:820px;margin:auto;display:flex;align-items:center;gap:10px}
h1{font-size:21px;margin:0;flex:1}.sub{font-size:13px;color:var(--muted);margin-top:3px}
main{max-width:820px;margin:auto;padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden;box-shadow:var(--shadow)}
.pad{padding:16px}.hero{padding:18px}.hero h2{margin:0 0 6px;font-size:23px}.hero p{margin:0;color:var(--muted);line-height:1.45}
.day-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.difficulty-guide{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.difficulty-guide strong{display:block;font-size:13px;margin-bottom:6px}
.difficulty-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.difficulty-row span{text-align:center;white-space:nowrap}
.difficulty-note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
button{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:750;background:#e4e7ec;color:var(--ink);min-height:46px}
button.primary{background:var(--accent);color:#fff}button.secondary{background:#fff;border:1px solid var(--line)}button.good{background:var(--good);color:#fff}
button:disabled{opacity:.45}.small-btn{min-height:38px;padding:8px 10px;font-size:14px}
.nav-btn{background:transparent;padding:6px 8px;min-height:36px;font-size:22px}.header-spacer{flex:1}.top-btn{background:#e4e7ec;padding:6px 10px;min-height:34px;font-size:13px;border-radius:9px}.report-search{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:12px 0}.report-search input{min-width:0}.match-count{font-size:12px;color:var(--muted);margin-top:4px}.report-match-active{outline:3px solid #fbbf24;outline-offset:3px;border-radius:10px}.report-find-float{position:fixed;z-index:30;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;background:rgba(23,32,51,.96);color:#fff;border-radius:999px;padding:7px 8px;box-shadow:0 5px 18px rgba(16,24,40,.28)}.report-find-float.hidden{display:none}.report-find-float button{min-height:36px;padding:5px 11px;border-radius:999px;background:#fff;color:var(--ink);font-size:18px}.report-find-float span{min-width:72px;text-align:center;font-size:12px;font-weight:800;white-space:nowrap}
.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.start-grid button{padding:15px 6px}
.order{font-weight:800;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 12px}
.station-head{padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}.station-title{font-weight:850;font-size:18px;flex:1}.station-meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{font-size:12px;font-weight:750;border-radius:999px;padding:5px 9px;background:#e5e7eb}.badge.done{background:var(--goodbg);color:var(--good)}
.station-body{padding:0 12px 14px}.exercise{border:1px solid rgba(23,32,51,.09);border-radius:14px;padding:14px 12px 10px;margin:10px 0;background:var(--exercise-bg,#f8fafc);box-shadow:0 1px 3px rgba(16,24,40,.04)}.exercise h3{font-size:16px;margin:0 0 2px}.hint{font-size:12px;color:var(--muted);margin-bottom:8px}
.previous{font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;margin:7px 0 10px;line-height:1.4}
.set-card{background:#fafafa;border:1px solid #e4e7ec;border-radius:12px;padding:10px;margin:8px 0}.set-title{font-weight:850;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field-grid.three{grid-template-columns:1fr 1fr 1fr}.field{min-width:0}label{display:block;font-size:11px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;border:1px solid #c7cbd1;border-radius:10px;padding:9px;background:#fff;font:inherit;font-size:16px;min-height:44px}input[type=number]{text-align:center}textarea{min-height:80px;text-align:left}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:5px}.stepper button{padding:0;min-height:44px;font-size:22px;background:#e4e7ec}.stepper input{min-width:0}
.increment-row{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:12px;color:var(--muted)}.increment-row select{width:auto;min-height:36px;padding:6px 26px 6px 8px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.actions button{flex:1}.delete{background:#fee2e2;color:var(--danger);min-height:36px;padding:6px 10px}

.cue{font-size:12px;line-height:1.45;background:rgba(255,255,255,.62);border-left:4px solid rgba(23,32,51,.22);border-radius:8px;padding:8px 10px;margin:7px 0 9px}
.setup-field{margin-top:9px}.setup-field textarea{min-height:58px;font-size:15px}
.technique-focus{grid-column:1/-1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.68);border:1px solid #d0d5dd;border-radius:10px;padding:9px 10px;margin-top:2px;font-size:14px;font-weight:700}.technique-focus input{width:21px;min-height:21px;margin:0;flex:0 0 auto}.technique-focus .tf-note{font-size:11px;font-weight:500;color:var(--muted);margin-left:auto}
.band-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:4px}.band-choice{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.72);border:1px solid #d0d5dd;border-radius:9px;padding:8px;font-size:14px}.band-choice input{width:20px;min-height:20px;margin:0}
.station-location{font-size:13px;font-weight:800;color:var(--accent2);margin-top:2px}.program-badge{display:inline-block;margin-left:6px;font-size:11px;border-radius:999px;padding:3px 7px;background:#eef2ff;color:#344054;vertical-align:middle}

.complete{width:100%;margin-top:14px;background:var(--goodbg);color:var(--good);min-height:49px}.complete.done{background:var(--good);color:#fff}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.footer button{max-width:390px;flex:1}
.summary{text-align:center;padding:22px 18px}.congrats-volume{background:var(--goodbg);color:var(--good);border-radius:14px;padding:15px 12px;margin:16px 0 4px;font-size:19px;font-weight:850;line-height:1.35}.highlights{text-align:left;background:#fffaf0;border:1px solid #f3dfad;border-radius:14px;padding:13px 14px;margin:16px 0}.highlight{font-weight:760;line-height:1.4;padding:5px 0}.remember{background:var(--accent);color:#fff;border-radius:14px;padding:14px;margin:16px 0;text-align:left}.remember .sub{color:#d0d5dd}.journey-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.journey-box{background:#f8fafc;border-radius:12px;padding:12px}.journey-box strong{display:block;font-size:19px}.journey-box span{font-size:11px;color:var(--muted)}.summary h2{font-size:25px;margin:0 0 6px}.big-number{font-size:42px;font-weight:900;letter-spacing:-1px;margin:14px 0 2px}.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#f8fafc;border-radius:12px;padding:11px 6px}.stat strong{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.history-item{padding:13px 0;border-bottom:1px solid #e5e7eb}.history-item:last-child{border-bottom:0}.history-top{display:flex;gap:10px;align-items:flex-start}.history-title{font-weight:800;flex:1}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:12px}.awake-note{background:var(--goodbg);color:var(--good);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin:0 0 12px}.hidden{display:none!important}
@media(max-width:520px){.field-grid.three{grid-template-columns:1fr 1fr}.summary-stats{grid-template-columns:1fr 1fr 1fr}.day-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

async function requestWakeLock(){
 wakeLockWanted=true;
 if(!('wakeLock' in navigator))return false;
 try{
  if(!wakeLock)wakeLock=await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release',()=>{wakeLock=null});
  return true;
 }catch(err){
  console.warn('Screen wake lock unavailable:',err);
  return false;
 }
}
async function releaseWakeLock(){
 wakeLockWanted=false;
 if(wakeLock){try{await wakeLock.release()}catch(err){console.warn('Could not release wake lock:',err)}wakeLock=null}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&wakeLockWanted&&view.screen==='workout')requestWakeLock();
});

function normalizeExerciseName(value){return String(value||'').trim().toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim()}
function slugExerciseName(value){return normalizeExerciseName(value).replace(/\s+/g,'_')||`exercise_${uid()}`}
function allExerciseDefinitions(){return {...exercises,...(db?.exerciseLibrary||{})}}
function rebuildExerciseLookup(){
 const defs=allExerciseDefinitions();
 return Object.fromEntries(Object.entries(defs).flatMap(([id,ex])=>[[normalizeExerciseName(ex.name),id],[normalizeExerciseName(id),id]]));
}
function canonicalExerciseId(value){
 const raw=String(value||'').trim();
 const lower=raw.toLowerCase();
 const lookup=rebuildExerciseLookup();
 return EXERCISE_ALIASES[raw]||HISTORICAL_NAME_ALIASES[lower]||lookup[normalizeExerciseName(raw)]||slugExerciseName(raw);
}
function genericExerciseDefinition(id,name=id){
 return {name:String(name||id).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),kind:'weight',label:'Weight / resistance',increment:2.5,multiplier:1,category:'Historical',equipment:'Varies',historical:true};
}
function ensureExerciseDefinition(id,definition){
 if(exercises[id])return exercises[id];
 db.exerciseLibrary=db.exerciseLibrary||{};
 if(!db.exerciseLibrary[id])db.exerciseLibrary[id]={...genericExerciseDefinition(id,definition?.name||id),...(definition||{})};
 return db.exerciseLibrary[id];
}
function exerciseDefinition(id){return exercises[id]||db.exerciseLibrary?.[id]||ensureExerciseDefinition(id)}
function remapExerciseData(data,sourceLibrary={}){
 const out={};
 for(const [rawId,value] of Object.entries(data||{})){
  const sourceDef=sourceLibrary[rawId]||sourceLibrary[canonicalExerciseId(rawId)]||null;
  const id=canonicalExerciseId(sourceDef?.name||rawId);
  ensureExerciseDefinition(id,sourceDef||{name:rawId});
  out[id]=value;
 }
 return out;
}

function migrateDatabaseToV14(){
 if(db.version==='15')return;
 const unifyBackSquat=data=>{
  const mapped=remapExerciseData(data);
  if(mapped.back_squat&&!mapped.barbell_back_squat)mapped.barbell_back_squat=mapped.back_squat;
  delete mapped.back_squat;
  return mapped;
 };
 db.history=(db.history||[]).map(w=>({...w,version:'16',data:unifyBackSquat(w.data)}));
 db.drafts=Object.fromEntries(Object.entries(db.drafts||{}).map(([day,w])=>[day,{...w,version:'16',data:unifyBackSquat(w.data)}]));
 db.increments=Object.fromEntries(Object.entries(db.increments||{}).map(([id,v])=>[id==='back_squat'?'barbell_back_squat':canonicalExerciseId(id),Number(v)]).filter(([id,v])=>exerciseDefinition(id)&&Number.isFinite(v)&&v>0));
 db.exerciseLibrary=db.exerciseLibrary||{};db.version='15.1';saveDb();
}

function newWorkout(day,date=today()){

 Object.values(programs[day].stations).flatMap(st=>st.exercises).forEach(id=>w.data[id]=defaultData(exerciseDefinition(id)));
 return w;
}
function defaultData(ex){
 if(ex.kind==='cardio') return {speed:'',distance:'',difficulty:'',notes:'',setup:'',techniqueFocus:false};
 if(ex.kind==='pullup') return [{bands:[],hookHeight:'',reps:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='plankSplit') return [{fullReps:'',kneeReps:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='pushupVariation') return [{variation:'',reps:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='weightHold') return [{weight:'',reps:'',holdSeconds:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='hamstringCurl') return [{weight:'',reps:'',variation:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='singleLegPlyo') return [{weight:'',boxHeight:'',reps:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='time') return [{seconds:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='reps') return [{reps:'',difficulty:'',setup:'',techniqueFocus:false}];
 if(ex.kind==='drop') return [{weight1:'',weight2:'',reps:'',difficulty:'',setup:'',techniqueFocus:false}];
 return [{weight:'',reps:'',difficulty:'',setup:'',techniqueFocus:false}];
}

const EXERCISE_HISTORY_GROUPS=[
 ['barbell_back_squat','back_squat'],
 ['deadlift','barbell_deadlift','conventional_deadlift'],
 ['barbell_bench_press','bench'],
 ['overhead_tricep_extension','tricep'],
 ['walking_lunges','lunges']
];
const exerciseHistoryKeyCache=new Map();
let exerciseHistoryIndexCache=null;
function normalizeExerciseIdentity(value){
 return normalizeExerciseName(value)
  .replace(/\bbb\b/g,'barbell')
  .replace(/\bdb\b/g,'dumbbell')
  .replace(/\bkb\b/g,'kettlebell')
  .replace(/\bsa\b/g,'single arm')
  .replace(/\bsl\b/g,'single leg')
  .replace(/\brdl\b/g,'romanian deadlift')
  .replace(/\bpull ups\b/g,'pull up')
  .replace(/\bpush ups\b/g,'push up')
  .replace(/\blunges\b/g,'lunge')
  .replace(/\bcurls\b/g,'curl')
  .replace(/\bextensions\b/g,'extension')
  .replace(/\s+/g,' ')
  .trim();
}
function historicalExerciseKey(id){
 const raw=String(id||'');
 if(exerciseHistoryKeyCache.has(raw))return exerciseHistoryKeyCache.get(raw);
 const canonical=canonicalExerciseId(raw);
 let representative=canonical;
 for(const group of EXERCISE_HISTORY_GROUPS){
  const canonicalGroup=group.map(value=>canonicalExerciseId(value));
  if(group.includes(raw)||group.includes(canonical)||canonicalGroup.includes(canonical)){
   representative=canonicalExerciseId(group[0]);
   break;
  }
 }
 const def=allExerciseDefinitions()[representative]||allExerciseDefinitions()[canonical];
 const key=normalizeExerciseIdentity(def?.name||representative||canonical||raw);
 exerciseHistoryKeyCache.set(raw,key);
 exerciseHistoryKeyCache.set(canonical,key);
 return key;
}
function buildExerciseHistoryIndex(){
 if(exerciseHistoryIndexCache)return exerciseHistoryIndexCache;
 const index=new Map();
 const rows=[...db.history].sort((a,b)=>String(b.finishedAt||b.date||'').localeCompare(String(a.finishedAt||a.date||'')));
 for(const workout of rows){
  for(const exerciseId of Object.keys(workout.data||{})){
   const key=historicalExerciseKey(exerciseId);
   if(key&&!index.has(key))index.set(key,{workout,exerciseId});
  }
 }
 exerciseHistoryIndexCache=index;
 return index;
}
function mostRecentExerciseRecord(id){
 return buildExerciseHistoryIndex().get(historicalExerciseKey(id))||null;
}
function formatHistoryDate(value){
 if(!value)return 'unknown date';
 const d=new Date(value+'T12:00:00');
 return Number.isNaN(d.getTime())?value:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function lastExerciseSummary(id){
 const record=mostRecentExerciseRecord(id); if(!record) return 'No prior workout recorded yet.';
 const h=record.workout,ex=exerciseDefinition(id),d=h.data[record.exerciseId],date=formatHistoryDate(h.date);
 if(ex.kind==='cardio') return `Last performed ${date}: speed ${d?.speed||'—'}${d?.distance?` · distance ${d.distance}`:''}${d?.techniqueFocus?' · 🎯 Technique focus':''}${d?.setup?` · ${d.setup}`:''}`;
 if(!Array.isArray(d)) return `Last performed ${date}: prior data available.`;
 const parts=[...d].reverse().map(s=>{
  let main='';
  if(ex.kind==='pullup') main=`${Array.isArray(s.bands)&&s.bands.length?s.bands.join(' + '):'No band listed'} · hook ${s.hookHeight||'—'} · ${s.reps||'—'} reps`;
  else if(ex.kind==='plankSplit') main=`${s.fullReps||0} full + ${s.kneeReps||0} knee`;
  else if(ex.kind==='pushupVariation') main=`${s.variation||'Variation not listed'} · ${s.reps||'—'} reps`;
  else if(ex.kind==='weightHold') main=`${s.weight||'—'} lb × ${s.reps||'—'}${s.holdSeconds?` · ${s.holdSeconds} sec hold`:''}`;
  else if(ex.kind==='hamstringCurl') main=`${s.reps||'—'} reps · ${s.variation||'Variation not listed'}${s.weight?` · ${s.weight} lb`:''}`;
  else if(ex.kind==='singleLegPlyo') main=`${s.weight||'—'} lb each × ${s.reps||'—'} each side${s.boxHeight?` · box ${s.boxHeight}`:''}`;
  else if(ex.kind==='band') main=`${s.weight||s.band||'—'} band · ${s.reps||'—'} reps`;
  else if(ex.kind==='time') main=`${s.seconds||'—'} sec`;
  else if(ex.kind==='reps') main=`${s.reps||'—'} reps`;
  else if(ex.kind==='drop') main=`${s.weight1||'—'}→${s.weight2||'—'} × ${s.reps||'—'}`;
  else main=`${s.weight||'—'} lb × ${s.reps||'—'}`;
  return `${main}${s.difficulty?` · ${s.difficulty}`:''}${s.techniqueFocus?' · 🎯 Technique focus':''}${s.setup?` · ${s.setup}`:''}`;
 }).join(' | ');
 return `Last performed ${date}: ${parts}`;
}

function allStationsDone(w){return stationNumbers(w.day).every(n=>w.completed[n])}
function sideMultiplier(ex){
 if(Number(ex?.sideMultiplier)>0)return Number(ex.sideMultiplier);
 return /each side/i.test(String(ex?.target||''))?2:1;
}
function totalVolume(w){
 let total=0;
 for(const [id,d] of Object.entries(w.data)){
  const ex=exerciseDefinition(id);if(!ex||!ex.multiplier||!Array.isArray(d))continue;
  const sides=sideMultiplier(ex);
  for(const s of d){
   const reps=Number(s.reps)||0;
   if(ex.kind==='drop')total+=((Number(s.weight1)||0)+(Number(s.weight2)||0))*reps*ex.multiplier*sides;
   else total+=(Number(s.weight)||0)*reps*ex.multiplier*sides;
  }
 }
 return Math.round(total);
}
function hasLoggedValue(obj){return Object.values(obj||{}).some(v=>typeof v==='boolean'?v:String(v).trim()!=='')}
function countSets(w){let n=0;for(const [id,d] of Object.entries(w.data)){const ex=exerciseDefinition(id);if(Array.isArray(d))n+=d.filter(s=>hasLoggedValue(s)).length;else if(exerciseDefinition(id)?.kind==='cardio'&&hasLoggedValue(d))n++}return n}
function countExercises(w){let n=0;for(const d of Object.values(w.data)){if(Array.isArray(d)){if(d.some(s=>hasLoggedValue(s)))n++}else if(hasLoggedValue(d))n++}return n}
function durationMinutes(w){if(!w.startedAt||!w.finishedAt)return null;return Math.max(1,Math.round((new Date(w.finishedAt)-new Date(w.startedAt))/60000))}
function exerciseMax(id,w){const ex=exerciseDefinition(id),d=w?.data?.[id];if(!ex||!Array.isArray(d))return 0;if(ex.kind==='drop')return Math.max(0,...d.flatMap(s=>[Number(s.weight1)||0,Number(s.weight2)||0]));if(!['weight'].includes(ex.kind))return 0;return Math.max(0,...d.map(s=>Number(s.weight)||0))}
function repsAtMax(id,w,max){const d=w?.data?.[id];if(!Array.isArray(d)||!max)return 0;return d.reduce((n,s)=>n+((Number(s.weight)||0)===max?(Number(s.reps)||0):0),0)}
function comparablePrevious(w){return [...db.history].filter(h=>h.day===w.day&&h.id!==w.id&&(h.finishedAt||h.date)<(w.finishedAt||w.date)).sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date))[0]}
function workoutHighlights(w){
 const previous=comparablePrevious(w),highlights=[],improvements=[];
 for(const id of Object.keys(w.data)){
  const ex=exerciseDefinition(id),now=exerciseMax(id,w);if(!ex||!now)continue;
  const priorBest=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>exerciseMax(id,h)));
  const previousMax=exerciseMax(id,previous);
  if(priorBest&&now>priorBest){improvements.push({rank:100+now,text:`⭐ New ${ex.name} personal best — ${now} lb`});continue}
  if(priorBest&&now===priorBest){improvements.push({rank:70,text:`⭐ Matched your best ${ex.name} — ${now} lb`});continue}
  if(previousMax&&now>previousMax){improvements.push({rank:80,text:`⭐ Increased ${ex.name} from ${previousMax} to ${now} lb`});continue}
  if(previousMax&&now===previousMax&&repsAtMax(id,w,now)>repsAtMax(id,previous,previousMax)) improvements.push({rank:60,text:`⭐ More reps at your top ${ex.name} weight`});
 }
 improvements.sort((a,b)=>b.rank-a.rank);highlights.push(...improvements.slice(0,3).map(x=>x.text));
 const priorVolume=previous?totalVolume(previous):0,volume=totalVolume(w);
 if(previous&&volume>priorVolume&&highlights.length<3)highlights.push(`📈 Higher ${w.title} volume than last time`);
 if(allStationsDone(w)&&highlights.length<4)highlights.push('⭐ Completed every station');
 const expected=Object.values(programs[w.day].stations).flatMap(st=>st.exercises).length;
 if(countExercises(w)===expected&&highlights.length<4)highlights.push('✅ Logged every exercise');
 const workoutNumber=db.history.filter(h=>h.id!==w.id).length+1;
 if([10,25,50,100,250,500].includes(workoutNumber))highlights.unshift(`💪 Workout #${workoutNumber}`);
 const deadlift=Math.max(exerciseMax('barbell_romanian_deadlift',w),exerciseMax('single_leg_romanian_deadlift',w));
 const priorDeadlift=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>Math.max(exerciseMax('barbell_romanian_deadlift',h),exerciseMax('single_leg_romanian_deadlift',h))));
 if(deadlift>=200&&priorDeadlift<200)highlights.unshift('🔥 First 200 lb deadlift!');
 const bench=exerciseMax('barbell_bench_press',w),priorBench=Math.max(0,...db.history.filter(h=>h.id!==w.id).map(h=>exerciseMax('barbell_bench_press',h)));
 if(bench>=100&&priorBench<100)highlights.unshift('🔥 First 100 lb bench press!');
 if(!highlights.length)highlights.push('⭐ Another workout added to your strength journey');
 return highlights.slice(0,5);
}
function finishWorkout(){
 const w=view.workout,editing=!!view.editingId;if(!editing&&!allStationsDone(w)){alert('Mark all stations complete before finishing the workout.');return}
 w.notes=document.getElementById('workoutNotes')?.value||w.notes||'';

 w.version='16';w.highlights=workoutHighlights(w);w.primaryHighlight=w.highlights[0];

   return true;
  }catch(err){

  }

function workoutIdentity(w){
 return [w.date||'',w.day||'',w.title||''].join('|').toLowerCase();
}
function normalizedImportedWorkout(raw,sourceLibrary={}){
 const w=raw?.workout||raw;
 if(!w||typeof w!=='object'||!w.date||!w.day||!w.data)return null;
 const copy=JSON.parse(JSON.stringify(w));
 copy.id=copy.id||uid();
 copy.version='0.5';
 copy.program=copy.program||'Historical Import';
 copy.title=copy.title||programs[copy.day]?.title||'Workout';
 copy.completed=copy.completed||{1:true,2:true,3:true,4:true};
 copy.stationOrder=copy.stationOrder||[1,2,3,4];
 copy.finishedAt=copy.finishedAt||`${copy.date}T12:00:00`;
 copy.startedAt=copy.startedAt||copy.finishedAt;
 copy.notes=copy.notes||'';
 copy.data=remapExerciseData(copy.data,sourceLibrary);
 if(!Object.keys(copy.data).length)return null;
 return copy;
}
function collectImportedWorkouts(payload){
 if(Array.isArray(payload))return payload;
 if(payload?.workout)return [payload.workout];
 if(Array.isArray(payload?.history))return payload.history;
 if(Array.isArray(payload?.workouts))return payload.workouts;
 return [];
}
function openImport(){document.getElementById('importInput').click()}
async function importWorkoutFiles(fileList){
 const files=[...fileList];
 if(!files.length)return;
 let imported=0,duplicates=0,invalid=0;
 const existingIds=new Set(db.history.map(w=>w.id));
 const existingKeys=new Set(db.history.map(workoutIdentity));
 for(const file of files){
  try{
   const payload=JSON.parse(await file.text());
   const sourceLibrary=payload?.exerciseLibrary||payload?.db?.exerciseLibrary||{};
   for(const [rawId,def] of Object.entries(sourceLibrary)){const id=canonicalExerciseId(def?.name||rawId);ensureExerciseDefinition(id,def)}
   const rows=collectImportedWorkouts(payload?.db||payload);
   if(!rows.length){invalid++;continue}
   for(const raw of rows){
    const w=normalizedImportedWorkout(raw,sourceLibrary);
    if(!w){invalid++;continue}
    const key=workoutIdentity(w);
    if(existingIds.has(w.id)||existingKeys.has(key)){duplicates++;continue}
    db.history.push(w);existingIds.add(w.id);existingKeys.add(key);imported++;
   }
  }catch{invalid++}
 }
 db.history.sort((a,b)=>(a.finishedAt||a.date).localeCompare(b.finishedAt||b.date));
 saveDb();
 document.getElementById('importInput').value='';
 alert(`Import complete: ${imported} workout${imported===1?'':'s'} added, ${duplicates} duplicate${duplicates===1?'':'s'} skipped${invalid?`, ${invalid} file or record${invalid===1?'':'s'} could not be read`:''}.`);
 render();
}

let reportSearchMatches=[],reportSearchIndex=-1;
function syncReportFindFloat(){const box=document.getElementById('reportFindFloat'),label=document.getElementById('reportFindFloatLabel');if(!box||!label)return;if(!reportSearchMatches.length){box.classList.add('hidden');label.textContent='';return}box.classList.remove('hidden');label.textContent=`${reportSearchIndex+1} of ${reportSearchMatches.length}`;}
function updateReportSearch(){const input=document.getElementById('reportSearch'),count=document.getElementById('reportMatchCount');if(!input||!count)return;const q=input.value.trim().toLowerCase();document.querySelectorAll('.report-exercise').forEach(el=>el.classList.remove('report-match-active'));if(!q){reportSearchMatches=[];reportSearchIndex=-1;count.textContent='';syncReportFindFloat();return}reportSearchMatches=[...document.querySelectorAll('.report-exercise')].filter(el=>(el.dataset.reportName||'').includes(q));reportSearchIndex=reportSearchMatches.length?0:-1;count.textContent=reportSearchMatches.length?`1 of ${reportSearchMatches.length} matches`:'0 matches';syncReportFindFloat();if(reportSearchMatches.length)focusReportMatch()}
function focusReportMatch(){document.querySelectorAll('.report-exercise').forEach(el=>el.classList.remove('report-match-active'));if(reportSearchIndex<0||!reportSearchMatches.length){syncReportFindFloat();return}const el=reportSearchMatches[reportSearchIndex];el.classList.add('report-match-active');el.scrollIntoView({behavior:'smooth',block:'center'});const count=document.getElementById('reportMatchCount');if(count)count.textContent=`${reportSearchIndex+1} of ${reportSearchMatches.length} matches`;syncReportFindFloat();}
function stepReportSearch(direction){if(!reportSearchMatches.length){updateReportSearch();if(!reportSearchMatches.length)return}reportSearchIndex=(reportSearchIndex+direction+reportSearchMatches.length)%reportSearchMatches.length;focusReportMatch()}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
function renderReports(){
 const month=currentProgramMonth();
 return `<section class="card pad"><strong>Progress Reports</strong><div class="sub">Choose the view that answers the question you have today.</div><div class="actions" style="margin-top:16px;display:grid;gap:12px"><button class="primary" style="text-align:left;padding:16px" onclick="openMonthlyReport()"><strong>📅 Monthly Progress</strong><span class="sub" style="display:block;color:#d0d5dd;margin-top:4px">See how you progressed through ${esc(month||'the current month')}.</span></button><button style="text-align:left;padding:16px" onclick="openAllTimeReport()"><strong>📈 All-Time Progress</strong><span class="sub" style="display:block;margin-top:4px">See patterns and progress across your complete workout history.</span></button></div><div class="previous" style="margin-top:16px"><strong>How comparisons work</strong><br>Weight, reps, exercise variation, assistance/resistance, and difficulty are considered when the data supports it. Technique Focus stays in history but is excluded from performance comparisons. A changed rep range or setup is not automatically treated as regression.</div></section>`;
}
function renderMonthlyReport(){
 const month=currentProgramMonth(),all=monthlyWorkouts(),eligible=all.filter(reportComparisonEligible),rows=reportExerciseRows(all),total=all.reduce((n,w)=>n+totalVolume(w),0),tech=techniqueSetCount(all);
 const classified=rows.map(r=>({...r,classification:classifyReportRow(r)})),starKeys=topThreeImprovementKeys(rows);
 const progressed=classified.filter(r=>r.classification.status.includes('Progressed')||r.classification.status.includes('Progress across')).length,maintained=classified.filter(r=>r.classification.status.includes('Maintained')).length,changed=classified.filter(r=>r.classification.status.includes('Different')).length;
 return `<section class="card pad"><div class="actions" style="margin:0 0 12px"><button class="small-btn" onclick="backToReports()">← Progress Reports</button></div><strong>📅 ${esc(month||'Monthly')} Progress</strong><div class="sub">A live month-to-date report. It becomes your completed month-end view after the final workout is logged.</div><div class="journey-grid" style="margin-top:14px"><div class="journey-box"><strong>${all.length}</strong><span>workouts</span></div><div class="journey-box"><strong>${total.toLocaleString()}</strong><span>lb training volume</span></div></div><div class="journey-grid" style="margin-top:10px"><div class="journey-box"><strong>${progressed}</strong><span>progress signals</span></div><div class="journey-box"><strong>${tech}</strong><span>technique-focus sets</span></div></div><div class="previous" style="margin-top:14px"><strong>Monthly snapshot</strong><br>🟢/🔵 ${progressed} progressed · → ${maintained} maintained · ↔ ${changed} different stimulus/setup</div></section><section class="card pad"><strong>Exercise-by-Exercise</strong><div class="sub">First comparable performance → latest comparable performance, with the full month's trajectory used to identify the best comparable result.</div>${rows.length?renderReportCards(rows,999,starKeys):'<p class="sub">More repeated performances are needed for this month.</p>'}</section>`;
}
function renderAllTimeReport(){
 const all=[...db.history].sort((a,b)=>String(a.date).localeCompare(String(b.date))),eligible=all.filter(reportComparisonEligible),allRows=reportExerciseRows(all,1),repeatRows=allRows.filter(r=>r.records.length>=2),recent=eligible.slice(-8),recentAvg=recent.length?Math.round(recent.reduce((n,w)=>n+totalVolume(w),0)/recent.length):0,tech=techniqueSetCount(all),month=currentProgramMonth();
 const rowByKey=new Map(allRows.map(r=>[r.key,r])),currentRows=currentProgramExerciseOrder().map(x=>rowByKey.get(x.key)).filter(Boolean),starKeys=topThreeImprovementKeys(allRows);
 return `<section class="card pad"><div class="actions" style="margin:0 0 12px"><button class="small-btn" onclick="backToReports()">← Progress Reports</button></div><strong>📈 All-Time Progress</strong><div class="sub">Your complete training history, with the exercises you are training now featured first and your full history organized by movement family below.</div><div class="report-search"><input id="reportSearch" type="search" placeholder="Find an exercise…" oninput="updateReportSearch()"><button class="small-btn" onclick="stepReportSearch(-1)" aria-label="Previous match">‹</button><button class="small-btn" onclick="stepReportSearch(1)" aria-label="Next match">›</button></div><div id="reportMatchCount" class="match-count"></div><div id="reportFindFloat" class="report-find-float hidden"><button onclick="stepReportSearch(-1)" aria-label="Previous match">‹</button><span id="reportFindFloatLabel"></span><button onclick="stepReportSearch(1)" aria-label="Next match">›</button></div><div class="journey-grid" style="margin-top:14px"><div class="journey-box"><strong>${all.length}</strong><span>workouts logged</span></div><div class="journey-box"><strong>${repeatRows.length}</strong><span>repeat exercises compared</span></div></div><div class="journey-grid" style="margin-top:10px"><div class="journey-box"><strong>${recentAvg.toLocaleString()}</strong><span>avg volume · last ${recent.length}</span></div><div class="journey-box"><strong>${tech}</strong><span>technique-focus sets</span></div></div><div class="previous" style="margin-top:14px"><strong>Comparison rules</strong><br>🎯 Technique Focus sets remain in history but are excluded from performance comparisons.<br>↔ Meaningful variations such as paused/tempo work remain separate rather than being forced into direct load comparisons.<br>% Change is shown only where a percentage is meaningful; different rep ranges may use estimated capacity rather than load alone.<br>⭐ marks the three exercises with the largest positive meaningful percentage improvement in this report.</div></section><section class="card pad"><strong>⭐ Current Program — ${esc(month||'Current Month')}</strong><div class="sub">Exercises from this month's program are featured here in workout/program order. They also appear again in their movement families below.</div>${currentRows.length?renderReportCards(currentRows,999,starKeys):'<p class="sub">Complete workouts this month to populate your current-program history.</p>'}</section><section class="card pad"><strong>Complete Exercise History</strong><div class="sub">Every exercise with saved performance data, organized by movement family. Current-month exercises are intentionally included again here.</div></section>${renderFamilySections(allRows,starKeys)}`;
}

function renderHome(){
 const weekday=dayForDate(),days=Object.keys(programs),rows=[...db.history].sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date)),last=rows[0];
 const backupCurrent=!!last&&db.lastBackupWorkoutId===last.id;
 return `<section class="card hero"><h2>Ready to lift? 🏋️</h2><p>Choose today's workout. Your entries save automatically on this device.</p><div class="day-grid">${days.map(d=>`<button class="${d===weekday?'primary':''}" onclick="openDay('${d}')">${d}<span class="sub" style="display:block;color:${d===weekday?'#d0d5dd':'var(--muted)'}">${programs[d].title}</span></button>`).join('')}</div><div class="difficulty-guide"><strong>Difficulty Guide</strong><div class="difficulty-row"><span><b>E:</b> ~3+ reps left</span><span><b>M:</b> ~2 reps left</span><span><b>H:</b> ~0–1 reps left</span></div><div class="difficulty-note">Rate by reps left — not by how hard it felt.</div></div></section>
 <section class="card pad"><strong>Your Strength Journey</strong><div class="journey-grid"><div class="journey-box"><strong>${db.history.length}</strong><span>workouts logged</span></div><div class="journey-box"><strong>${last?last.day:'—'}</strong><span>last workout</span></div></div>${last?`<div class="previous"><strong>Last highlight</strong><br>${esc(last.primaryHighlight||last.highlights?.[0]||'⭐ Workout complete')}</div>`:'<p class="sub">Your first completed workout will begin your story.</p>'}<div class="previous"><strong>Backup status</strong><br>${backupCurrent?'✓ Latest workout backed up':'Latest workout has not been saved to iCloud yet'}<div class="sub" style="margin-top:5px">iPhone requires you to approve each file save. Choose Save to Files → iCloud Drive → Fearless Lift Log → Backups.</div></div><div class="actions">${last?`<button onclick="replayLastFinish()">⭐ Replay Last Finish Screen</button>`:''}<button onclick="openHistory()">View History</button><button onclick="openExerciseIndex()">Exercise Index</button><button onclick="openReports()">Progress Reports</button><button onclick="openImport()">Import Workouts</button><button onclick="downloadAll()">Back Up All Data to iCloud</button></div></section>`;
}
function renderWorkout(){
 const w=view.workout,p=programs[view.day],nums=stationNumbers();
 const reportToggle=`<label style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:12px;color:var(--muted)"><input type="checkbox" style="width:18px;min-height:18px;margin:0" ${w.includeInProgressReports!==false?'checked':''} onchange="view.workout.includeInProgressReports=this.checked;saveDraft()"><span>Include this workout in Progress Reports</span></label>`;const startCard=!w.startStation?`<section class="card pad"><strong>Which station are you starting at?</strong><div class="sub">The circular order is recorded automatically.</div><div class="start-grid" style="grid-template-columns:repeat(${nums.length},1fr)">${nums.map(n=>`<button onclick="startWorkout(${n})">${n}</button>`).join('')}</div>${reportToggle}</section>`:(view.editingId?`<section class="card pad"><strong style="font-size:13px">Progress Reports</strong>${reportToggle}</section>`:'');
 const order=w.startStation?`<div class="order">Started at Station ${w.startStation} · ${w.stationOrder.join(' → ')}</div>`:'';
 const stationOrder=w.startStation?w.stationOrder:nums;
 const ordinals=['1st','2nd','3rd','4th','5th','6th'];
 const stations=stationOrder.map((n,pos)=>{const done=!!w.completed[n],station=p.stations[n],ids=station.exercises;return `<section class="card" id="station-${n}" style="scroll-margin-top:88px"><div class="station-head" onclick="this.nextElementSibling.classList.toggle('hidden')"><div><div class="station-title"><span aria-hidden="true">${STATION_ICONS[n]||''}</span> Station ${n} • ${esc(station.name)}</div><div class="station-location">${esc(station.duration||'')}</div><div class="station-meta">${w.startStation?ordinals[pos]+' in workout':'Choose a starting station'}</div></div><span class="badge ${done?'done':''}">${done?'Complete':'Open'}</span></div><div class="station-body ${done?'hidden':''}">${ids.map((id,exerciseIndex)=>exerciseHtml(id,exerciseIndex,n)).join('')}<button class="complete ${done?'done':''}" onclick="event.stopPropagation();toggleStation(${n})">${done?'✓ Station Complete':'Mark Station Complete'}</button></div></section>`}).join('');
 const notice=view.editingId?'✏️ Editing a completed workout. Make your corrections, then tap Save Changes.':'☀️ Screen stays awake while this workout is open. “Repeat Previous Performance” copies load, reps, bands, hook height, variation, difficulty, Technique Focus, and setup notes.';
 return `<div class="awake-note">${notice}</div>${startCard}${order}${stations}<section class="card pad" id="workout-notes" style="scroll-margin-top:88px"><strong>Workout notes</strong><textarea id="workoutNotes" placeholder="Anything worth remembering…" onchange="view.workout.notes=this.value;saveDraft()">${esc(w.notes)}</textarea></section>`;
}
function renderSummary(){const w=view.workout,s=view.summary,highlights=s.highlights||w.highlights||['⭐ Workout complete'],backupCurrent=db.lastBackupWorkoutId===w.id,title=s.edited?'✏️ Workout Updated':'🏋️ Workout Complete!',message=s.edited?'Your corrected workout now totals':'Congratulations — you lifted';return `<section class="card summary"><h2>${title}</h2><div class="sub">${w.day} · ${w.title}</div><div class="congrats-volume">${message} ${s.volume.toLocaleString()} pounds${s.edited?'.':' today!'}</div><div class="highlights">${highlights.map(h=>`<div class="highlight">${esc(h)}</div>`).join('')}</div><div class="remember"><div class="sub">Today you'll remember:</div><strong>${esc(w.primaryHighlight||highlights[0])}</strong></div><div class="summary-stats"><div class="stat"><strong>${s.exercises}</strong><span>exercises</span></div><div class="stat"><strong>${s.sets}</strong><span>sets logged</span></div><div class="stat"><strong>${s.duration||'—'}</strong><span>${s.duration?'minutes':'duration'}</span></div></div><div class="sub" style="margin-top:8px">Training volume = weight × reps, including both dumbbells and both sides when applicable.</div><div class="notice">✓ Saved on this device<br>${backupCurrent?'✓ Latest workout backup completed':'iCloud backup still needed'}</div><div class="actions" style="margin-top:16px"><button onclick="editWorkout('${w.id}')">Edit Workout</button><button onclick="downloadBackup(view.workout)">Save to iCloud</button><button class="primary" onclick="goHome()">Return Home</button></div><p class="sub" style="margin-top:18px">${s.edited?'Correction saved.':'See you next workout. 💪'}</p></section>`}
function renderHistory(){
 const rows=[...db.history].sort((a,b)=>(b.finishedAt||b.date).localeCompare(a.finishedAt||a.date));
 return `<section class="card pad"><strong>Workout History</strong><div class="sub">Your strength story, workout by workout. Tap Edit to correct a completed workout.</div>${rows.length?rows.map(w=>`<div class="history-item"><div class="history-top"><div><div class="history-title">${w.day} · ${w.title}</div><div class="history-meta">${w.date} · ${totalVolume(w).toLocaleString()} lb volume</div></div><div class="actions" style="margin-top:0"><button class="small-btn" onclick="editWorkout('${w.id}')">Edit</button><button class="small-btn" onclick="downloadBackup(db.history.find(x=>x.id==='${w.id}'))">Backup</button></div></div>${(w.highlights||[]).slice(0,3).map(h=>`<div class="sub" style="margin-top:6px">${esc(h)}</div>`).join('')}${w.notes?`<div class="sub" style="margin-top:6px">${esc(w.notes)}</div>`:''}</div>`).join(''):'<p class="sub">No completed workouts yet.</p>'}</section>`;
}
function render(){
 migrateDatabaseToV14();migrateOldFriday();const app=document.getElementById('app'),footer=document.getElementById('footer'),back=document.getElementById('backBtn'),sub=document.getElementById('headerSub'),top=document.getElementById('topBtn');
 back.classList.toggle('hidden',view.screen==='home');back.onclick=goHome;top.classList.toggle('hidden',!['reports','monthlyReport','allTimeReport','history','exerciseIndex'].includes(view.screen));
 if(view.screen==='home'){sub.textContent='Know your history. Challenge yourself appropriately.';app.innerHTML=renderHome();footer.classList.add('hidden')}
 if(view.screen==='workout'){sub.textContent=`${view.editingId?'Editing · ':''}${view.day} · ${programs[view.day].title} · ${programs[view.day].month||'August 2026'}`;app.innerHTML=renderWorkout();footer.classList.remove('hidden');footer.innerHTML=view.editingId?`<button onclick="cancelEdit()">Cancel</button><button class="primary" onclick="finishWorkout()">Save Changes</button>`:`<button onclick="resetWorkout()">Reset</button><button class="primary" ${allStationsDone(view.workout)?'':'disabled'} onclick="finishWorkout()">Finish Workout</button>`}
 if(view.screen==='summary'){sub.textContent='Workout complete';app.innerHTML=renderSummary();footer.classList.add('hidden')}
 if(view.screen==='history'){sub.textContent='Your strength journey';app.innerHTML=renderHistory();footer.classList.add('hidden')}
 if(view.screen==='exerciseIndex'){sub.textContent='Your exercise history';app.innerHTML=renderExerciseIndex();footer.classList.add('hidden')}
 if(view.screen==='reports'){sub.textContent='Your progress reports';app.innerHTML=renderReports();footer.classList.add('hidden')}
 if(view.screen==='monthlyReport'){sub.textContent=`${currentProgramMonth()} progress`;app.innerHTML=renderMonthlyReport();footer.classList.add('hidden')}
 if(view.screen==='allTimeReport'){sub.textContent='Your all-time progress';app.innerHTML=renderAllTimeReport();footer.classList.add('hidden')}
}
document.getElementById('importInput').addEventListener('change',e=>importWorkoutFiles(e.target.files));
window.addEventListener('beforeunload',()=>{saveDraft();releaseWakeLock()});render();
</script>
